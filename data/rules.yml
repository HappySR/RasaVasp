version: "3.1"

rules:
# ============= BASIC INTERACTION RULES =============
- rule: Say goodbye anytime the user says goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Say thank you response
  steps:
  - intent: thank
  - action: utter_thank

- rule: Respond to bot identity question
  steps:
  - intent: ask_bot_identity
  - action: utter_bot_identity

